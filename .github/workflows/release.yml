name: Build and validate native release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing source tag, for example v0.1.1'
        required: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Fixed source and native ARM64 toolchain
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+[A-Za-z0-9.+-]*$ ]]
          test "$(git describe --tags --exact-match)" = "$VERSION"
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: shellcheck scripts/laya-macos.sh tools/release/prepare-ort-macos.sh
      - run: python3 scripts/test-macos.py
      - name: Prepare fixed CPU-only ORT and signed Mach-O package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash tools/release/prepare-ort-macos.sh "$RUNNER_TEMP/ort-source" "$RUNNER_TEMP/cpu-ort"
          python3 tools/release/build-macos.py --version "$VERSION" --ort "$RUNNER_TEMP/cpu-ort"
      - name: Real deployment, update and rollback
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          id=$(python3 tools/release/package.py id)
          gh release download "model-$id" --pattern "model-$id.tar.gz" --dir dist
          model="dist/model-$id.tar.gz"
          program=dist/laya-server-macos-aarch64.tar.gz
          printf '%s\n' "VERSION=$VERSION" "MODEL_ID=$id" \
            "MODEL_SHA256=$(shasum -a 256 "$model" | cut -d ' ' -f 1)" "MODEL_BYTES=$(stat -f %z "$model")" \
            "MACOS_aarch64_SHA256=$(shasum -a 256 "$program" | cut -d ' ' -f 1)" "MACOS_aarch64_BYTES=$(stat -f %z "$program")" > dist/release.env
          python3 tools/release/smoke-macos.py --release-directory dist --root "$RUNNER_TEMP/中文 mac's deployment"
          echo "LAYA_TEST_MODEL=$(sed -n 's/^MODEL=//p' "$RUNNER_TEMP/中文 mac's deployment/current.env")" >> "$GITHUB_ENV"
          echo "LAYA_TEST_ORT=$(sed -n 's/^PROGRAM=//p' "$RUNNER_TEMP/中文 mac's deployment/current.env")/libonnxruntime.dylib" >> "$GITHUB_ENV"
      - name: Fixed model and real HTTP parity, CPU lifecycle
        run: |
          cargo test --release --locked --bin laya-server linux_system_one_model_parity -- --ignored --nocapture
          cargo test --release --locked --bin laya-server linux_http_model_parity_and_disconnect -- --ignored --nocapture
          for slots in 1 2; do
            LAYA_TEST_CONCURRENCY=$slots cargo test --release --locked --bin laya-server linux_scheduler_concurrency -- --ignored --nocapture
          done
          python3 docs/validation/macos/lifecycle.py --program "$(dirname "$LAYA_TEST_ORT")" --model "$LAYA_TEST_MODEL" --out "$RUNNER_TEMP/lifecycle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-aarch64
          path: dist/laya-server-macos-aarch64.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
      - name: Fixed source, toolchain and native MSVC environment
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^v[0-9]+[A-Za-z0-9.+-]*$' -or (git describe --tags --exact-match) -ne $env:VERSION) { throw 'Source tag mismatch' }
          rustup show active-toolchain
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /s /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1],$Matches[2],'Process') }
          }
          foreach ($name in @('VCToolsRedistDir','VCToolsVersion','WindowsSDKVersion','PATH','INCLUDE','LIB','LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name,'Process'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: '& scripts/test-windows.ps1'
      - name: Build verified CPU DLL package and inspect PE dependencies
        env:
          VERSION: ${{ inputs.version }}
        run: '& tools/release/build-windows.ps1 -Version $env:VERSION'
      - name: Fixed model and real install/update/rollback gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $id = (Get-FileHash docs/model-manifest.json).Hash.ToLowerInvariant().Substring(0,16)
          gh release download "model-$id" --pattern "model-$id.tar.gz" --dir dist
          if ($LASTEXITCODE) { throw 'Model download failed' }
          $model = Get-Item "dist/model-$id.tar.gz"
          $program = Get-Item dist/laya-server-windows-x86_64.zip
          @("VERSION=$env:VERSION","MODEL_ID=$id","MODEL_SHA256=$((Get-FileHash $model.FullName).Hash.ToLowerInvariant())","MODEL_BYTES=$($model.Length)",
            "WINDOWS_x86_64_SHA256=$((Get-FileHash $program.FullName).Hash.ToLowerInvariant())","WINDOWS_x86_64_BYTES=$($program.Length)") | Set-Content -Encoding ascii dist/release.env
          & tools/release/smoke-windows.ps1 -ReleaseDirectory dist -Root "$env:TEMP/laya-windows-release"
          $current = Get-Content "$env:TEMP/laya-windows-release/current.json" -Raw | ConvertFrom-Json
          $env:LAYA_TEST_MODEL = $current.Model
          $env:LAYA_TEST_ORT = Join-Path $current.Program onnxruntime.dll
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin laya-server model::tests::parity::linux_system_one_model_parity -- --ignored --nocapture
          if ($LASTEXITCODE) { throw 'Fixed model parity failed' }
          cargo test --release --locked --target x86_64-pc-windows-msvc --bin laya-server model::tests::http::linux_http_model_parity_and_disconnect -- --ignored --nocapture
          if ($LASTEXITCODE) { throw 'Real HTTP parity failed' }
          & docs/validation/windows/lifecycle.ps1 -Program $current.Program -Model $current.Model -Work "$env:TEMP/laya-windows-release/logs/lifecycle"
          if ($LASTEXITCODE) { throw 'Real CPU lifecycle failed' }
          'Windows Server runner: native CPU gates passed here; publish only after the same ZIP hash passes Windows 11 acceptance.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-x86_64
          path: dist/laya-server-windows-x86_64.zip
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
      - name: Check input and installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+[A-Za-z0-9.+-]*$ ]]
          test "$(git describe --tags --exact-match)" = "$VERSION"
          shellcheck scripts/install.sh tools/release/*.sh
          python3 scripts/test-install.py
      - name: Build program, private libraries and corresponding sources
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/work:ro" -v "$PWD/dist:/out" -w /work \
            rust:1.98.1-slim-bookworm@sha256:ff521445a372125ed4f76e1453a1f8098f2d05332d1601d30db1c1f62757e730 \
            sh tools/release/build.sh "$VERSION" /out
      - name: Download fixed published model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(python3 tools/release/package.py id)
          gh release download "model-$id" --pattern "model-$id.tar.gz" --dir dist
          mkdir -p /tmp/laya-model /tmp/laya-package
          python3 -c 'import sys,tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter="data")' "dist/model-$id.tar.gz" /tmp/laya-model
          python3 -c 'import sys,tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter="data")' "dist/laya-server-linux-${{ matrix.arch }}.tar.gz" /tmp/laya-package
          (cd /tmp/laya-model && sha256sum -c /tmp/laya-package/model-files.sha256)
      - name: Native CPU real inference (required)
        run: sh tools/release/smoke.sh /tmp/laya-package /tmp/laya-model
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.arch }}
          path: |
            dist/laya-server-linux-*.tar.gz
            dist/runtime-sources-*.tar.gz
          if-no-files-found: error

  draft:
    needs: [build, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Assemble verified release metadata and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          id=$(python3 tools/release/package.py id)
          gh release download "model-$id" --pattern "model-$id.tar.gz" --dir dist
          python3 tools/release/package.py release --version "$VERSION"
          python3 tools/release/test-package.py
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" \
            --notes-file tools/release/RELEASE-NOTES.md \
            dist/install.sh dist/release.env dist/SHA256SUMS \
            dist/laya-server-linux-*.tar.gz dist/runtime-sources-*.tar.gz \
            dist/laya-server-windows-x86_64.zip dist/laya.ps1 \
            dist/laya-server-macos-aarch64.tar.gz dist/laya-macos.sh
