name: Rust checks (no model)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Native ARM64 OS and SDK
        run: |
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Shell and deployment command boundaries
        run: |
          shellcheck scripts/laya-macos.sh tools/release/prepare-ort-macos.sh
          /bin/bash -n scripts/laya-macos.sh
          python3 scripts/test-macos.py
          python3 tools/release/test-package.py
      - name: Scope of this job
        if: always()
        run: echo 'No-model macOS ARM64 checks only; real CPU/model gates run in the release workflow. OS/SDK above are the actual validation scope.' >> "$GITHUB_STEP_SUMMARY"
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: PowerShell 5.1 boundaries
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $os | Select-Object Caption,Version,BuildNumber | Format-List
          & scripts/test-windows.ps1
      - name: Real model validation - NOT RUN
        if: always()
        run: |
          'NOT RUN: real model, tokenizer, native ORT parity and deployment checks; no weights or DLLs. Server CI does not establish Windows 11 support.' | Out-File -Append $env:GITHUB_STEP_SUMMARY
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Installer boundaries (no deployment or model)
        run: |
          shellcheck scripts/install.sh tools/release/*.sh
          python3 scripts/test-install.py
      - name: Real model validation — NOT RUN
        if: always()
        run: |
          echo '::notice::NOT RUN: Linux real-model smoke and engine parity/recovery are ignored; no model weights or native runtime are installed.'
          echo 'CLI, protocol, sequence, postprocessing and static engine-error checks only. Real multilingual model validation: **NOT RUN**. Green CI does not establish inference or Jev compatibility.' >> "$GITHUB_STEP_SUMMARY"
