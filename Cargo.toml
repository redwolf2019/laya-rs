[package]
name = "laya-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT AND Apache-2.0"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1.3"
mediatype = { version = "=0.23.0", default-features = false }
prometheus-client = { version = "=0.25.0", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tokio = { version = "1.53.1", default-features = false, features = ["test-util", "io-util"] }
