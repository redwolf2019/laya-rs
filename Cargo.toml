[package]
name = "laya-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT AND Apache-2.0"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
